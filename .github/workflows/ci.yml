name: Build & Test CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # 1. Backend CI: Restore, Build & Run 47 Unit Tests (.NET 9)
  # ----------------------------------------------------
  backend-ci:
    name: Backend (.NET 9) Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore src/Backend/CloudService.sln

      - name: Build Backend Solution
        run: dotnet build src/Backend/CloudService.sln --configuration Release --no-restore

      - name: Run Backend Unit Tests
        run: dotnet test tests/CloudService.UnitTests/CloudService.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

  # ----------------------------------------------------
  # 2. Frontend CI: Lint, TypeCheck & Build (Next.js 16)
  # ----------------------------------------------------
  frontend-ci:
    name: Frontend (Next.js) Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Next.js Production App
        run: npm run build

  # ----------------------------------------------------
  # 3. Docker CI: Build Backend & Frontend Docker Images
  # ----------------------------------------------------
  docker-build:
    name: Docker Build (Backend + Frontend)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/Backend
          dockerfile: ./src/Backend/Dockerfile
          push: false
          tags: cloudservice-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          dockerfile: ./src/frontend/Dockerfile
          push: false
          tags: cloudservice-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

